[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minta-beep"
version = "0.1.0"
description = "Pure-Python RFC 3080/3081 BEEP with the MINTA RPC profile (urn:minta:beep:rpc:1); asyncio, sync, ASGI and WSGI."
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
keywords = ["beep", "rfc3080", "rfc3081", "rpc", "asgi", "wsgi"]

[tool.setuptools]
packages = ["minta_beep"]
