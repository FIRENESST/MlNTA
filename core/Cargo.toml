[workspace]
resolver = "2"
members = ["beep", "gateway", "ffi", "bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FIRENESST/MlNTA"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
bytes = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
